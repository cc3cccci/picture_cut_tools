<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>网格切图与分图工具 - Grid Image Splitter</title>
    <!-- Google Fonts: Inter & Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- JSZip for exporting ZIP files -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header class="app-header">
            <div class="logo-area">
                <svg class="logo-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                    <line x1="9" y1="3" x2="9" y2="21"></line>
                    <line x1="15" y1="3" x2="15" y2="21"></line>
                    <line x1="3" y1="9" x2="21" y2="9"></line>
                    <line x1="3" y1="15" x2="21" y2="15"></line>
                </svg>
                <h1>网格切图工具 <span class="badge">PRO</span></h1>
            </div>
            <p class="subtitle">轻松将九宫格、十二宫格或自定义网格图片拆分为单图，支持手动微调边界，一键导出打包。</p>
        </header>

        <!-- Main Workspace -->
        <main class="workspace">
            <!-- Upload Area (Shown when no image is loaded) -->
            <div id="upload-zone" class="upload-zone">
                <input type="file" id="file-input" accept="image/*" class="file-input" multiple>
                <div class="upload-content">
                    <div class="upload-icon-wrapper">
                        <svg class="upload-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                            <polyline points="17 8 12 3 7 8"></polyline>
                            <line x1="12" y1="3" x2="12" y2="15"></line>
                        </svg>
                    </div>
                    <h2>拖拽图片（支持多张）到这里，或<span>点击浏览文件</span></h2>
                    <p class="upload-tip">支持 PNG, JPG, JPEG, WEBP 等多图批量导入与自动按序切图</p>
                </div>
            </div>

            <!-- Editor Container (Hidden until image loaded) -->
            <div id="editor-container" class="editor-container hidden">
                <!-- Canvas Workspace (Left/Center) -->
                <div class="canvas-workspace">
                    <div class="canvas-wrapper">
                        <canvas id="editor-canvas"></canvas>
                        <div id="canvas-overlay-tip" class="canvas-overlay-tip">
                            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
                                <circle cx="12" cy="12" r="10"></circle>
                                <line x1="12" y1="16" x2="12" y2="12"></line>
                                <line x1="12" y1="8" x2="12.01" y2="8"></line>
                            </svg>
                            <span>提示：在画布中直接拖拽绿色虚线或边缘黄色手柄来微调边界</span>
                        </div>
                    </div>

                    <!-- Image Queue Container -->
                    <div id="queue-container" class="queue-container">
                        <div class="queue-header">
                            <div class="queue-title-wrapper">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14">
                                    <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                                    <line x1="9" y1="3" x2="9" y2="21"></line>
                                    <line x1="15" y1="3" x2="15" y2="21"></line>
                                </svg>
                                <span>图片队列 (<span id="queue-count">0</span>)</span>
                            </div>
                            <div class="queue-actions">
                                <button id="btn-queue-sync" class="btn btn-xs" title="同步当前选中图片的网格及去边参数到全部图片">
                                    同步参数到全部
                                </button>
                                <button id="btn-queue-sort" class="btn btn-xs" title="按文件名对队列进行排序 (支持 A-Z / Z-A 切换)">
                                    按名称排序
                                </button>
                                <button id="btn-queue-clear" class="btn btn-xs btn-danger">
                                    清空队列
                                </button>
                            </div>
                        </div>
                        <div class="queue-list-wrapper">
                            <div id="queue-list" class="queue-list">
                                <!-- JS dynamic rendering -->
                            </div>
                            <div class="queue-add-card" id="queue-add-card">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
                                    <line x1="12" y1="5" x2="12" y2="19"></line>
                                    <line x1="5" y1="12" x2="19" y2="12"></line>
                                </svg>
                                <span>追加</span>
                                <input type="file" id="queue-add-input" accept="image/*" multiple style="display: none;">
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Sidebar (Right) -->
                <aside class="sidebar">
                    <div class="sidebar-controls">
                        <!-- Grid Configuration Section -->
                        <div class="panel-section">
                            <h3><svg class="section-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="9" y1="3" x2="9" y2="21"></line><line x1="3" y1="9" x2="21" y2="9"></line></svg> 网格设置</h3>
                            
                            <div class="preset-grids">
                                <button class="btn btn-preset active" data-rows="3" data-cols="3">
                                    <span class="preset-name">9 宫格</span>
                                    <span class="preset-desc">3 × 3</span>
                                </button>
                                <button class="btn btn-preset" data-rows="3" data-cols="4">
                                    <span class="preset-name">12 宫格</span>
                                    <span class="preset-desc">3 × 4</span>
                                </button>
                                <button class="btn btn-preset" data-rows="4" data-cols="3">
                                    <span class="preset-name">12 宫格</span>
                                    <span class="preset-desc">4 × 3</span>
                                </button>
                                <button class="btn btn-preset" id="btn-custom-preset">
                                    <span class="preset-name">自定义</span>
                                    <span class="preset-desc">自定义行列</span>
                                </button>
                            </div>

                            <!-- Custom grid form (collapsible/visible when Custom selected) -->
                            <div id="custom-grid-form" class="custom-grid-form hidden">
                                <div class="input-group">
                                    <label for="input-rows">行数 (Rows)</label>
                                    <input type="number" id="input-rows" min="1" max="10" value="3">
                                </div>
                                <div class="input-group">
                                    <label for="input-cols">列数 (Cols)</label>
                                    <input type="number" id="input-cols" min="1" max="10" value="3">
                                </div>
                                <button id="btn-apply-custom" class="btn btn-secondary btn-sm">应用网格</button>
                            </div>

                            <div class="grid-actions" style="display: flex; gap: 8px;">
                                <button id="btn-autocrop" class="btn btn-secondary" style="flex: 1; flex-direction: row; gap: 6px; padding: 10px 0;">
                                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><path d="M9 3v18M15 3v18M3 9h18M3 15h18"></path></svg>
                                    自动去边
                                </button>
                                <button id="btn-reset" class="btn btn-secondary" style="flex: 1; flex-direction: row; gap: 6px; padding: 10px 0;">
                                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"></path><path d="M21 3v5h-5"></path><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"></path><path d="M8 16H3v5"></path></svg>
                                    重置网格
                                </button>
                            </div>

                            <!-- Autocrop settings drawer -->
                            <div id="autocrop-settings" class="autocrop-settings" style="margin-top: 8px; font-size: 11px; display: flex; flex-direction: column; gap: 6px; padding: 10px; background: rgba(0,0,0,0.18); border-radius: var(--radius-md); border: 1px solid var(--border-color);">
                                <div style="display: flex; justify-content: space-between; align-items: center;">
                                    <span style="color: var(--text-secondary);">去边识别色彩容差 (Tolerance)</span>
                                    <span id="autocrop-tol-val" style="color: var(--color-accent-hover); font-weight: 600;">45</span>
                                </div>
                                <input type="range" id="autocrop-tolerance" min="10" max="150" value="45" style="height: 4px;">
                            </div>

                            <!-- Gutter & Slice Shrink settings -->
                            <div class="slice-adjustments-container" style="margin-top: 8px; font-size: 11px; display: flex; flex-direction: column; gap: 8px; padding: 10px; background: rgba(0,0,0,0.18); border-radius: var(--radius-md); border: 1px solid var(--border-color);">
                                <div style="display: flex; flex-direction: column; gap: 6px;">
                                    <div style="display: flex; justify-content: space-between; align-items: center;">
                                        <span style="color: var(--text-secondary);">分图单元格缝隙 (Grid Gutter)</span>
                                        <span id="grid-gutter-val" style="color: var(--color-success); font-weight: 600;">0 px</span>
                                    </div>
                                    <input type="range" id="grid-gutter" min="0" max="60" value="0" style="height: 4px;">
                                </div>

                                <div style="display: flex; flex-direction: column; gap: 6px;">
                                    <div style="display: flex; justify-content: space-between; align-items: center;">
                                        <span style="color: var(--text-secondary);">分图边缘向内收缩 (Slice Shrink)</span>
                                        <span id="autocrop-shrink-val" style="color: var(--color-accent-hover); font-weight: 600;">2 px</span>
                                    </div>
                                    <input type="range" id="autocrop-shrink" min="0" max="15" value="2" style="height: 4px;">
                                </div>
                            </div>
                        </div>

                        <!-- Export Options Section -->
                        <div class="panel-section">
                            <h3><svg class="section-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg> 导出设置</h3>
                            
                            <div class="settings-grid">
                                <div class="input-group">
                                    <label for="select-format">格式</label>
                                    <select id="select-format">
                                        <option value="image/png">PNG (无损)</option>
                                        <option value="image/jpeg">JPEG (压缩)</option>
                                        <option value="image/webp">WEBP (高效)</option>
                                    </select>
                                </div>
                                
                                <div class="input-group" id="quality-setting" style="display: none;">
                                    <div class="label-row">
                                        <label for="range-quality">质量</label>
                                        <span id="quality-val">90%</span>
                                    </div>
                                    <input type="range" id="range-quality" min="10" max="100" value="90">
                                </div>
                            </div>
                        </div>

                        <!-- Actions Bottom -->
                        <div class="sidebar-footer">
                            <button id="btn-reupload" class="btn btn-secondary">
                                重新上传
                            </button>
                            <div class="action-buttons-group">
                                <button id="btn-export-zip" class="btn btn-secondary btn-icon">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                        <polyline points="21 15 16 20 11 15"></polyline>
                                        <line x1="16" y1="10" x2="16" y2="20"></line>
                                        <path d="M12 4H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-6"></path>
                                    </svg>
                                    打包 ZIP 导出
                                </button>
                            </div>
                        </div>
                    </div>

                    <!-- Output Previews -->
                    <div class="panel-section preview-section">
                        <div class="section-header">
                            <h3><svg class="section-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg> 切图预览 (<span id="preview-count">0</span>)</h3>
                        </div>
                        <div id="previews-container" class="previews-container">
                            <!-- Populated by JavaScript -->
                        </div>
                    </div>
                </aside>
            </div>
        </main>
    </div>

    <!-- Notification system -->
    <div id="toast-container" class="toast-container"></div>

    <!-- Lightbox Modal for Large Preview -->
    <div id="preview-modal" class="modal hidden">
        <span class="modal-close">&times;</span>
        
        <!-- Left Arrow -->
        <button id="modal-prev-btn" class="modal-nav-btn modal-prev" aria-label="上一张">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="24" height="24"><polyline points="15 18 9 12 15 6"></polyline></svg>
        </button>

        <div class="modal-content-wrapper">
            <img id="modal-img" class="modal-img" src="" alt="放大预览">
            <div class="modal-info">
                <span id="modal-title">子图 #1</span>
                <span id="modal-dim">300 x 300 px</span>
            </div>
            <div class="modal-actions">
                <button id="modal-download-btn" class="btn btn-primary btn-icon btn-sm" style="flex-direction: row; gap: 8px;">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                    下载此单图
                </button>
            </div>
        </div>

        <!-- Right Arrow -->
        <button id="modal-next-btn" class="modal-nav-btn modal-next" aria-label="下一张">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="24" height="24"><polyline points="9 18 15 12 9 6"></polyline></svg>
        </button>
    </div>

    <script src="app.js"></script>
</body>
</html>
